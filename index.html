<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>DISC 유형 진단</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#121212;
    --surface:#181818;
    --surface-2:#1f1f1f;
    --surface-3:#252525;
    --text:#ffffff;
    --text-2:#b3b3b3;
    --border:#4d4d4d;
    --border-light:#7c7c7c;
    --accent:#39d5d5;
    --accent-ink:#0b1f1f;
    --negative:#f3727f;
    --shadow-heavy:rgba(0,0,0,.5) 0 8px 24px;
    --shadow-mid:rgba(0,0,0,.3) 0 8px 8px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    font-size:16px;line-height:1.4;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(96px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}

  header{padding:28px 0 8px}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--accent)}
  h1{font-size:24px;font-weight:700;margin:6px 0 10px}
  .guide{
    background:var(--surface);border-radius:8px;padding:14px 16px;
    font-size:14px;color:var(--text-2);line-height:1.55
  }
  .guide b{color:var(--text)}
  .scale{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .scale span{font-size:12px;font-weight:700;background:var(--surface-2);color:var(--text);border-radius:9999px;padding:4px 10px}
  .scale span em{font-style:normal;color:var(--accent)}

  .box{
    background:var(--surface);border-radius:8px;margin-top:12px;padding:14px 14px 6px;
    transition:box-shadow .2s, background .2s;
  }
  .box.done{box-shadow:0 0 0 1px var(--accent) inset}
  .box.flash{animation:flash 1s ease 2}
  @keyframes flash{50%{box-shadow:0 0 0 2px var(--negative) inset}}
  .box-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .box-title{font-size:14px;font-weight:700}
  .box-state{font-size:12px;font-weight:700;color:var(--text-2)}
  .box.done .box-state{color:var(--accent)}

  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--surface-3)}
  .row:first-of-type{border-top:0}
  .word{font-size:16px;font-weight:600;flex:1;min-width:0}
  .picks{display:flex;gap:6px;flex-shrink:0}
  .pick{
    width:40px;height:40px;border-radius:50%;
    border:0;background:var(--surface-2);color:var(--text-2);
    box-shadow:rgb(124,124,124) 0 0 0 1px inset;
    font:inherit;font-size:15px;font-weight:700;cursor:pointer;
    transition:background .12s,color .12s,transform .08s;
  }
  .pick:active{transform:scale(.92)}
  .pick.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
  .pick.used{opacity:.35}
  .pick.on.used{opacity:1}

  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    background:rgba(18,18,18,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border-top:1px solid var(--surface-3);
    padding:12px 0 calc(12px + env(safe-area-inset-bottom));
  }
  .bar .wrap{display:flex;align-items:center;gap:12px}
  .progress{flex:1;min-width:0}
  .progress-text{font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:6px}
  .progress-text b{color:var(--text)}
  .track{height:4px;border-radius:9999px;background:var(--surface-3);overflow:hidden}
  .fill{height:100%;width:0;background:var(--accent);border-radius:9999px;transition:width .25s}

  .btn{
    border:0;border-radius:9999px;cursor:pointer;
    font:inherit;font-size:15px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
    padding:14px 24px;white-space:nowrap;
  }
  .btn-primary{background:var(--accent);color:var(--accent-ink)}
  .btn-primary[aria-disabled="true"]{background:var(--surface-2);color:var(--text-2)}
  .btn-ghost{background:transparent;color:var(--text);box-shadow:var(--border-light) 0 0 0 1px inset}

  .toast{
    position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
    background:var(--surface-3);color:var(--text);font-size:14px;font-weight:600;
    padding:10px 16px;border-radius:9999px;box-shadow:var(--shadow-heavy);
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100% - 32px);text-align:center
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 결과 */
  #result{display:none;padding:28px 0 24px}
  body.show-result #test{display:none}
  body.show-result #result{display:block}
  body.show-result .bar{display:none}
  body.show-result{padding-bottom:24px}
  .result-card{background:var(--surface);border-radius:8px;padding:28px 20px 22px;text-align:center;box-shadow:var(--shadow-mid)}
  .type-badges{display:flex;justify-content:center;gap:12px;margin:6px 0 14px}
  .type-badge{
    width:96px;height:96px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;
  }
  .type-badges.multi .type-badge{width:76px;height:76px;font-size:38px}
  .type-name{font-size:24px;font-weight:700;margin:0}
  .type-sub{font-size:14px;color:var(--text-2);margin:6px 0 0}
  .scores{margin-top:22px;text-align:left}
  .score-row{display:flex;align-items:center;gap:10px;padding:7px 0}
  .score-label{width:64px;font-size:14px;font-weight:700}
  .score-label small{display:block;font-size:12px;font-weight:400;color:var(--text-2)}
  .score-track{flex:1;height:10px;border-radius:9999px;background:var(--surface-3);overflow:hidden}
  .score-fill{height:100%;border-radius:9999px;background:var(--border-light);width:0;transition:width .6s ease}
  .score-row.top .score-fill{background:var(--accent)}
  .score-row.top .score-label{color:var(--accent)}
  .score-num{width:32px;text-align:right;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
  .total{font-size:12px;color:var(--text-2);text-align:right;margin-top:6px}
  .capture-tip{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:12px 16px;border-radius:9999px;background:var(--surface-2);color:var(--text);font-size:14px;font-weight:600;text-align:center}
  .capture-tip svg{flex-shrink:0;color:var(--accent)}
  .result-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .result-actions .btn{width:100%}
</style>
</head>
<body>

<div class="wrap">
  <section id="test">
    <header>
      <div class="eyebrow">DISC 간이 진단</div>
      <h1>DISC 유형 진단하기</h1>
      <div class="guide">
        10개 박스마다 <b>나를 가장 잘 드러내는 단어에 4점</b>, 그다음 3점, 2점, <b>나와 가장 거리가 먼 단어에 1점</b>을 주세요.<br>한 박스 안에서 같은 점수는 한 번만 쓸 수 있습니다.
        <div class="scale"><span><em>4</em> 가장 나다움</span><span><em>3</em></span><span><em>2</em></span><span><em>1</em> 가장 거리 멂</span></div>
      </div>
    </header>
    <div id="boxes"></div>
  </section>

  <section id="result" aria-live="polite">
    <div class="eyebrow" style="text-align:center">나의 DISC 유형</div>
    <div class="result-card">
      <div class="type-badges" id="typeBadges"></div>
      <p class="type-name" id="typeName"></p>
      <p class="type-sub" id="typeSub"></p>
      <div class="scores" id="scores"></div>
      <div class="total" id="total"></div>
    </div>
    <div class="capture-tip"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>이 화면을 캡처해 두세요</div>
    <div class="result-actions">
      <button class="btn btn-ghost" id="editBtn" type="button">점수 수정하기</button>
      <button class="btn btn-ghost" id="resetBtn" type="button">처음부터 다시 하기</button>
    </div>
  </section>
</div>

<div class="bar">
  <div class="wrap">
    <div class="progress">
      <div class="progress-text"><b id="doneCount">0</b> / 10 박스 완료</div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
    <button class="btn btn-primary" id="resultBtn" type="button" aria-disabled="true">결과 보기</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  /* 진단지 구성: 5개 열 x (윗박스, 아랫박스). labels는 하단 합산표의 줄 순서 */
  var COLUMNS = [
    { labels:['I','S','D','C'], top:['낙천적인','참을성 있는','결의가 굳은','객관적인'], bottom:['호의적인','격려하는','설득력 있는','따지는'] },
    { labels:['S','D','C','I'], top:['온건한','모험심 있는','꼼꼼한','즐거움 추구'], bottom:['부드러운','독립심 있는','내성적인','사교적인'] },
    { labels:['D','S','C','I'], top:['개척하는','진실한','정확한','활기찬'], bottom:['성취, 달성','조화, 사랑','안정, 독립','인정, 칭찬'] },
    { labels:['S','I','D','C'], top:['공손한','유쾌한','의욕적인','침착한'], bottom:['조심성 있는','다정한','주도적인','생각 깊은'] },
    { labels:['I','C','S','D'], top:['유쾌한','사려깊은','양보하는','용감한'], bottom:['외향적인','공평한','협조적인','자주적인'] }
  ];
  /* 종이 순서대로 박스 1~10: 윗줄 1~5, 아랫줄 6~10 */
  var BOXES = [];
  COLUMNS.forEach(function(c){ BOXES.push(c.top); });
  COLUMNS.forEach(function(c){ BOXES.push(c.bottom); });

  var TYPES = {
    D:{ name:'주도형', en:'Dominance' },
    I:{ name:'사교형', en:'Influence' },
    S:{ name:'안정형', en:'Steadiness' },
    C:{ name:'신중형', en:'Conscientiousness' }
  };
  var ORDER = ['D','I','S','C'];
  var VALUES = [4,3,2,1];
  var STORE_KEY = 'disc-test-v1';

  var scores = BOXES.map(function(){ return [0,0,0,0]; });
  try{
    var saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (Array.isArray(saved) && saved.length === 10) scores = saved;
  }catch(e){}

  function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(scores)); }catch(e){} }

  var boxesEl = document.getElementById('boxes');

  function render(){
    boxesEl.innerHTML = '';
    BOXES.forEach(function(words, b){
      var box = document.createElement('div');
      box.className = 'box';
      box.id = 'box-' + b;
      var head = '<div class="box-head"><span class="box-title">박스 ' + (b+1) + '</span><span class="box-state"></span></div>';
      var rows = words.map(function(w, i){
        var picks = VALUES.map(function(v){
          return '<button type="button" class="pick" data-b="'+b+'" data-w="'+i+'" data-v="'+v+'" aria-label="'+w+' '+v+'점">'+v+'</button>';
        }).join('');
        return '<div class="row"><span class="word">'+w+'</span><div class="picks">'+picks+'</div></div>';
      }).join('');
      box.innerHTML = head + rows;
      boxesEl.appendChild(box);
    });
    refresh();
  }

  function isComplete(b){
    var s = scores[b].slice().sort();
    return s.join() === '1,2,3,4';
  }

  function refresh(){
    var done = 0;
    for (var b = 0; b < 10; b++){
      var box = document.getElementById('box-' + b);
      var complete = isComplete(b);
      if (complete) done++;
      box.classList.toggle('done', complete);
      var filled = scores[b].filter(function(x){ return x > 0; }).length;
      box.querySelector('.box-state').textContent = complete ? '완료' : filled + ' / 4';
      var used = scores[b];
      box.querySelectorAll('.pick').forEach(function(btn){
        var w = +btn.dataset.w, v = +btn.dataset.v;
        var on = used[w] === v;
        btn.classList.toggle('on', on);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        btn.classList.toggle('used', !on && used.indexOf(v) !== -1);
      });
    }
    document.getElementById('doneCount').textContent = done;
    document.getElementById('fill').style.width = (done * 10) + '%';
    document.getElementById('resultBtn').setAttribute('aria-disabled', done === 10 ? 'false' : 'true');
  }

  function setScore(b, w, v){
    var row = scores[b];
    if (row[w] === v){ row[w] = 0; }
    else {
      var old = row[w];
      var other = row.indexOf(v);
      row[w] = v;
      if (other !== -1) row[other] = old; /* 같은 점수를 쓴 단어와 맞바꿈 */
      /* 3개가 채워지면 남은 점수를 자동 입력 */
      var empty = [], usedVals = [];
      row.forEach(function(x, i){ if (x === 0) empty.push(i); else usedVals.push(x); });
      if (empty.length === 1){
        var rest = VALUES.filter(function(val){ return usedVals.indexOf(val) === -1; });
        if (rest.length === 1) row[empty[0]] = rest[0];
      }
    }
    save();
    refresh();
  }

  boxesEl.addEventListener('click', function(e){
    var btn = e.target.closest('.pick');
    if (!btn) return;
    setScore(+btn.dataset.b, +btn.dataset.w, +btn.dataset.v);
  });

  function calculate(){
    var total = { D:0, I:0, S:0, C:0 };
    COLUMNS.forEach(function(col, c){
      col.labels.forEach(function(label, r){
        total[label] += scores[c][r] + scores[c + 5][r];
      });
    });
    return total;
  }

  var toastEl = document.getElementById('toast'), toastTimer;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
  }

  function showResult(){
    var t = calculate();
    var max = Math.max(t.D, t.I, t.S, t.C);
    var tops = ORDER.filter(function(k){ return t[k] === max; });

    var badges = document.getElementById('typeBadges');
    badges.className = 'type-badges' + (tops.length > 1 ? ' multi' : '');
    badges.innerHTML = tops.map(function(k){ return '<div class="type-badge">'+k+'</div>'; }).join('');
    document.getElementById('typeName').textContent =
      tops.map(function(k){ return TYPES[k].name; }).join(' · ') + (tops.length > 1 ? ' (공동)' : '');
    document.getElementById('typeSub').textContent =
      tops.map(function(k){ return TYPES[k].en; }).join(' · ');

    var html = ORDER.map(function(k){
      var pct = Math.round(t[k] / 40 * 100); /* 유형별 최대 40점 */
      return '<div class="score-row'+(tops.indexOf(k) !== -1 ? ' top' : '')+'">' +
        '<div class="score-label">'+k+'<small>'+TYPES[k].name+'</small></div>' +
        '<div class="score-track"><div class="score-fill" data-w="'+pct+'"></div></div>' +
        '<div class="score-num">'+t[k]+'</div></div>';
    }).join('');
    document.getElementById('scores').innerHTML = html;
    document.getElementById('total').textContent = '합계 ' + (t.D + t.I + t.S + t.C) + '점 / 100점';

    document.body.classList.add('show-result');
    window.scrollTo(0, 0);
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        document.querySelectorAll('.score-fill').forEach(function(el){ el.style.width = el.dataset.w + '%'; });
      });
    });
  }

  document.getElementById('resultBtn').addEventListener('click', function(){
    for (var b = 0; b < 10; b++){
      if (!isComplete(b)){
        var box = document.getElementById('box-' + b);
        box.scrollIntoView({ behavior:'smooth', block:'center' });
        box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash');
        toast('박스 ' + (b+1) + '의 점수를 모두 입력해 주세요');
        return;
      }
    }
    showResult();
  });

  document.getElementById('editBtn').addEventListener('click', function(){
    document.body.classList.remove('show-result');
    window.scrollTo(0, 0);
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    if (!confirm('입력한 점수를 모두 지우고 처음부터 다시 할까요?')) return;
    scores = BOXES.map(function(){ return [0,0,0,0]; });
    save();
    document.body.classList.remove('show-result');
    refresh();
    window.scrollTo(0, 0);
  });

  /* 테스트용 노출 */
  window.__disc = { COLUMNS:COLUMNS, calculate:calculate, setScores:function(s){ scores = s; refresh(); } };

  render();
})();
</script>
</body>
</html>
